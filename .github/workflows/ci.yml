name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Web
    # An administrator may route one reviewed same-repository PR head to an
    # isolated, temporary runner. Missing/mismatched variables retain hosted CI.
    runs-on: >-
      ${{ fromJSON(github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.sha == vars.AXIS_CI_SELF_HOSTED_SHA &&
          vars.AXIS_CI_SELF_HOSTED_LABELS || '["ubuntu-latest"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ runner.environment != 'self-hosted' && 'pnpm' || '' }}
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint schemas
        run: pnpm --filter @limes-axis/schemas lint

      - name: Test schemas
        run: pnpm --filter @limes-axis/schemas test

      - name: Lint
        run: pnpm --filter @limes-axis/web lint

      - name: Typecheck
        run: pnpm --filter @limes-axis/web typecheck

      - name: Test
        run: pnpm --filter @limes-axis/web test

      - name: Build
        env:
          NEXT_PUBLIC_AXIS_API_BASE_URL: http://127.0.0.1:65534
        run: pnpm --filter @limes-axis/web build

      - name: Install Playwright browsers
        run: pnpm --filter @limes-axis/web exec playwright install --with-deps chromium

      - name: Smoke test
        run: pnpm --filter @limes-axis/web test:e2e:smoke

  # The `web` job intentionally selects the API-unavailable smoke spec. This job
  # runs the four live files against a real API and Postgres. Read-only scenarios
  # stay parallel; shared-state writes run once in Chromium with one worker.
  integration:
    name: Integration (live API)
    # An administrator may route one reviewed same-repository PR head to an
    # isolated, temporary runner. Missing/mismatched variables retain hosted CI.
    runs-on: >-
      ${{ fromJSON(github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.sha == vars.AXIS_CI_SELF_HOSTED_SHA &&
          vars.AXIS_CI_SELF_HOSTED_LABELS || '["ubuntu-latest"]') }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axis
          POSTGRES_PASSWORD: axis
          POSTGRES_DB: axis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      AXIS_ENV: development
      AXIS_POSTGRES_DSN: postgresql+psycopg://axis:axis@localhost:5432/axis
      AXIS_OIDC_AUTH_REQUIRED: "false"
      AXIS_API_RATE_LIMIT_ENABLED: "false"
      AXIS_WORKFLOW_SIGNALS_ENABLED: "false"
      AXIS_API_BASE_URL: http://127.0.0.1:8000
      AXIS_PUBLIC_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_AXIS_API_BASE_URL: http://127.0.0.1:8000
      AXIS_E2E_LIVE_API: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: ${{ runner.environment != 'self-hosted' }}

      - name: Install API dependencies
        working-directory: services/api
        run: uv sync --locked

      - name: Test model persistence on PostgreSQL
        env:
          AXIS_MODEL_CONTRACT_POSTGRES_DSN: postgresql+psycopg://axis:axis@localhost:5432/axis
        run: make test-model-persistence-postgres

      - name: Start MinIO source fixture
        run: |
          docker run -d --name axis-ci-s3-input -p 127.0.0.1:19335:9000 \
            -e MINIO_ROOT_USER=axis335fixture \
            -e MINIO_ROOT_PASSWORD=axis335fixturepassword \
            quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z@sha256:9535594ad4122b7a78c6632788a989b96d9199b483d3bd71a5ceae73a922cdfa server /data
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 1 http://127.0.0.1:19335/minio/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs axis-ci-s3-input
          exit 1

      - name: Test S3 input and checkpoint contracts
        working-directory: services/api
        env:
          AXIS_RUN_S3_MINIO: "1"
          AXIS_RUN_S3_POSTGRES: "1"
          AXIS_MODEL_CONTRACT_BACKEND: postgresql
          AXIS_MODEL_CONTRACT_POSTGRES_DSN: postgresql+psycopg://axis:axis@localhost:5432/axis
        run: uv run pytest tests/integration/test_s3_source_minio.py tests/integration/test_s3_checkpoint_postgres.py -q

      - name: Stop MinIO source fixture
        if: always()
        run: docker rm -f axis-ci-s3-input > /dev/null 2>&1 || true

      # Migrations are Postgres-only (JSONB columns), which is why this job cannot
      # fall back to SQLite the way local development can.
      - name: Migrate database
        working-directory: services/api
        run: uv run alembic upgrade head

      - name: Start API
        working-directory: services/api
        run: |
          uv run uvicorn axis_api.main:create_app --factory \
            --host 127.0.0.1 --port 8000 > "${RUNNER_TEMP}/api.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/api.pid"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "API ready"; exit 0
            fi
            sleep 1
          done
          echo "API failed to become ready"; cat "${RUNNER_TEMP}/api.log"; exit 1

      # tenant_id and requested_by go in the body, and the actor needs the
      # demo:scenario:bootstrap scope — a query parameter with an empty body
      # answers 422, and a body without the scope answers 403.
      - name: Seed demo scenario
        run: |
          curl -fsS -X POST "http://127.0.0.1:8000/demo/bootstrap" \
            -H "content-type: application/json" \
            -d '{"tenant_id":"tenant_demo_manufacturing","requested_by":"ci","actor_scopes":["demo:scenario:bootstrap"]}' \
            > /dev/null

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ runner.environment != 'self-hosted' && 'pnpm' || '' }}
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @limes-axis/web exec playwright install --with-deps chromium

      - name: Build live console
        run: pnpm --filter @limes-axis/web build

      - name: Live read-only overview and story specs
        run: pnpm --filter @limes-axis/web test:e2e:live:read

      - name: Live state-mutating specs (Chromium, serial)
        run: pnpm --filter @limes-axis/web test:e2e:live:stateful

      - name: API log on failure
        if: failure()
        run: cat "${RUNNER_TEMP}/api.log" || true

      - name: Stop API
        if: always()
        run: |
          if [[ ! -f "${RUNNER_TEMP}/api.pid" ]]; then
            exit 0
          fi
          api_pid="$(<"${RUNNER_TEMP}/api.pid")"
          kill "${api_pid}" 2>/dev/null || true
          for _ in $(seq 1 20); do
            if ! kill -0 "${api_pid}" 2>/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          echo "API process ${api_pid} did not stop" >&2
          exit 1

  python:
    name: Python
    # An administrator may route one reviewed same-repository PR head to an
    # isolated, temporary runner. Missing/mismatched variables retain hosted CI.
    runs-on: >-
      ${{ fromJSON(github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.sha == vars.AXIS_CI_SELF_HOSTED_SHA &&
          vars.AXIS_CI_SELF_HOSTED_LABELS || '["ubuntu-latest"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: ${{ runner.environment != 'self-hosted' }}

      - name: Check documentation paths
        run: make docs-check

      - name: Install API dependencies
        working-directory: services/api
        run: uv sync --locked

      - name: Lint API
        working-directory: services/api
        run: uv run ruff check .

      - name: Test API
        working-directory: services/api
        run: uv run pytest

      - name: Check OpenAPI schema
        run: make openapi-check

      - name: Check deployment package
        run: make deployment-check

      - name: Check Helm deployment profile renders
        run: make deployment-profile-render-check

      - name: Check container image package
        run: make container-check

      - name: Check container release package
        run: make container-release-check

      - name: Check container security scan package
        run: make container-security-check

      - name: Check vulnerability management package
        run: make vulnerability-management-check

      - name: Install worker dependencies
        working-directory: services/worker
        run: uv sync --locked

      - name: Lint worker
        working-directory: services/worker
        run: uv run ruff check .

      - name: Test worker
        working-directory: services/worker
        run: uv run pytest

      - name: Install SDK dependencies
        working-directory: packages/sdk-python
        run: uv sync --locked

      - name: Lint SDK
        working-directory: packages/sdk-python
        run: uv run ruff check .

      - name: Test SDK
        working-directory: packages/sdk-python
        run: uv run pytest
