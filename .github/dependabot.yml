version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 4
    groups:
      npm-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/services/api"
      - "/services/worker"
      - "/packages/sdk-python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:20"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 4
    groups:
      python-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:40"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 4
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/apps/web"
      - "/services/api"
      - "/services/worker"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    directory: "/infra/docker"
    schedule:
      interval: "monthly"
      time: "07:20"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 2
    groups:
      compose-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      compose-security:
        applies-to: "security-updates"
        patterns:
          - "*"
